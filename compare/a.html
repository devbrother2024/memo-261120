<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>메모 홈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ---- Figma 변수 (Colors / Spacing) ---- */
    :root {
      --color-primary: #3182f6;
      --surface-page: #f2f4f6;
      --surface-card: #ffffff;
      --text-primary: #191f28;
      --text-secondary: #4e5968;
      --text-muted: #8b95a1;
      --text-on-primary: #ffffff;

      --label-blue: #3182f6;   --label-blue-soft: #e8f3ff;
      --label-green: #12a150;  --label-green-soft: #e3f8ec;
      --label-orange: #f76808; --label-orange-soft: #fff1e5;
      --label-pink: #e5397a;   --label-pink-soft: #ffeaf1;

      --space-4: 4px;  --space-8: 8px;  --space-12: 12px; --space-16: 16px;
      --space-20: 20px; --space-24: 24px; --space-34: 34px; --space-64: 64px;
      --radius-sm: 12px; --radius-md: 16px; --radius-xl: 24px; --radius-full: 999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--surface-page);
      color: var(--text-primary);
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    svg { display: block; flex: none; }

    /* ---- 텍스트 스타일 (Figma) ---- */
    .heading-xl { font-size: 28px; font-weight: 700; line-height: 38px; letter-spacing: -0.8px; }
    .title-md   { font-size: 17px; font-weight: 700; line-height: 24px; letter-spacing: -0.3px; }
    .label-md   { font-size: 15px; font-weight: 700; line-height: 22px; letter-spacing: -0.2px; }
    .caption-md { font-size: 15px; font-weight: 500; line-height: 22px; letter-spacing: -0.2px; }
    .caption-sm { font-size: 13px; font-weight: 500; line-height: 18px; letter-spacing: 0; }
    .body-sm    { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: -0.1px; }
    .button-md  { font-size: 17px; font-weight: 700; line-height: 24px; letter-spacing: -0.2px; }

    /* ---- 화면: 390 기준 모바일 폭, 세로 오토레이아웃 ---- */
    .screen {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: var(--space-64) var(--space-16) var(--space-34);
      display: flex;
      flex-direction: column;
      gap: var(--space-16);
      background: var(--surface-page);
    }
    .main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-16);
    }

    /* Header */
    .header { display: flex; flex-direction: column; gap: var(--space-8); padding: 0 var(--space-8); }
    .header__date { color: var(--text-muted); }
    .header__title { color: var(--text-primary); }
    .header__count { color: var(--color-primary); }

    /* Filter / Chip */
    .filter { display: flex; gap: var(--space-8); padding: 0 var(--space-4); }
    .chip {
      height: 36px;
      padding: 0 var(--space-16);
      display: inline-flex;
      align-items: center;
      border-radius: var(--radius-full);
      background: var(--surface-card);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .chip[aria-selected="true"] { background: var(--color-primary); color: var(--text-on-primary); }

    /* Card */
    .card {
      display: flex;
      flex-direction: column;
      padding: var(--space-8) 0;
      border-radius: var(--radius-xl);
      background: var(--surface-card);
    }
    .card__header {
      height: 40px;
      padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    .card__title { flex: 1 1 auto; min-width: 0; color: var(--text-primary); }
    .card__pin { color: var(--label-blue); }
    .card__action { display: inline-flex; align-items: center; gap: var(--space-4); color: var(--text-muted); }

    /* Memo item */
    .memo {
      display: flex;
      align-items: center;
      gap: var(--space-16);
      padding: var(--space-12) var(--space-20);
      min-height: 72px;
      text-align: left;
      width: 100%;
    }
    .memo__tile {
      width: 44px; height: 44px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
    }
    .memo__content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
    .memo__title { color: var(--text-primary); }
    .memo__preview { color: var(--text-secondary); }
    .memo__title, .memo__preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .memo__date { flex: none; color: var(--text-muted); }

    .memo--blue   .memo__tile { background: var(--label-blue-soft);   color: var(--label-blue); }
    .memo--green  .memo__tile { background: var(--label-green-soft);  color: var(--label-green); }
    .memo--orange .memo__tile { background: var(--label-orange-soft); color: var(--label-orange); }
    .memo--pink   .memo__tile { background: var(--label-pink-soft);   color: var(--label-pink); }

    /* Primary button */
    .btn-primary {
      width: 100%;
      height: 56px;
      padding: 0 var(--space-24);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-8);
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--text-on-primary);
    }

    /* 눌림 피드백 (시안에 없는 상태는 최소한으로) */
    .chip:active, .memo:active, .btn-primary:active, .card__action:active { opacity: .7; }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="main">

      <header class="header">
        <p class="header__date caption-md">10월 30일 금요일</p>
        <h1 class="header__title heading-xl">오늘까지 메모를<br><span class="header__count">128개</span> 남겼어요</h1>
      </header>

      <div class="filter" role="tablist" aria-label="메모 분류">
        <button class="chip label-md" role="tab" aria-selected="true" type="button">전체</button>
        <button class="chip label-md" role="tab" aria-selected="false" type="button">업무</button>
        <button class="chip label-md" role="tab" aria-selected="false" type="button">개인</button>
        <button class="chip label-md" role="tab" aria-selected="false" type="button">아이디어</button>
      </div>

      <section class="card" aria-label="고정한 메모">
        <div class="card__header">
          <svg class="card__pin" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 2.33334H10L9.4 5.80001L11.3333 8.00001H4.66667L6.6 5.80001L6 2.33334Z" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 8V13.3333" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h2 class="card__title label-md">고정한 메모</h2>
        </div>

        <button class="memo memo--blue" type="button">
          <span class="memo__tile"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.41667 3.66666H12.8333L16.5 7.33332V18.3333H6.41667V3.66666Z" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.8333 3.66666V7.33332H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="memo__content">
            <span class="memo__title title-md">디자인 리뷰 회의록</span>
            <span class="memo__preview body-sm">검수 기준과 다음 할 일 정리</span>
          </span>
          <span class="memo__date caption-sm">오늘</span>
        </button>

        <button class="memo memo--green" type="button">
          <span class="memo__tile"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.41667 3.66666H12.8333L16.5 7.33332V18.3333H6.41667V3.66666Z" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.8333 3.66666V7.33332H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="memo__content">
            <span class="memo__title title-md">주말 등산 준비</span>
            <span class="memo__preview body-sm">물 두 병, 간식, 바람막이 챙기기</span>
          </span>
          <span class="memo__date caption-sm">어제</span>
        </button>
      </section>

      <section class="card" aria-label="최근 메모">
        <div class="card__header">
          <h2 class="card__title label-md">최근 메모</h2>
          <button class="card__action caption-md" type="button">
            전체 보기
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <button class="memo memo--pink" type="button">
          <span class="memo__tile"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.41667 3.66669H12.8333L16.5 7.33335V18.3334H6.41667V3.66669Z" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.8333 3.66669V7.33335H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="memo__content">
            <span class="memo__title title-md">장보기 목록</span>
            <span class="memo__preview body-sm">우유, 계란, 사과, 커피 원두</span>
          </span>
          <span class="memo__date caption-sm">오늘</span>
        </button>

        <button class="memo memo--orange" type="button">
          <span class="memo__tile"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.41667 3.66669H12.8333L16.5 7.33335V18.3334H6.41667V3.66669Z" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.8333 3.66669V7.33335H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="memo__content">
            <span class="memo__title title-md">앱 아이콘 아이디어</span>
            <span class="memo__preview body-sm">메모지 모서리가 접힌 모양</span>
          </span>
          <span class="memo__date caption-sm">오늘</span>
        </button>

        <button class="memo memo--green" type="button">
          <span class="memo__tile"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.41667 3.66669H12.8333L16.5 7.33335V18.3334H6.41667V3.66669Z" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.8333 3.66669V7.33335H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="memo__content">
            <span class="memo__title title-md">읽을 책</span>
            <span class="memo__preview body-sm">디자인 시스템 책 두 권</span>
          </span>
          <span class="memo__date caption-sm">어제</span>
        </button>
      </section>

    </div>

    <button class="btn-primary button-md" type="button">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 4.16669V15.8334M4.16667 10H15.8333" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/></svg>
      새 메모 쓰기
    </button>
  </div>

  <script>
    // 필터 칩: 하나만 선택 상태로 (시안의 Selected / Default 상태)
    document.querySelectorAll('.filter').forEach(function (group) {
      group.addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        group.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-selected', c === chip ? 'true' : 'false'); });
      });
    });
  </script>
</body>
</html>
